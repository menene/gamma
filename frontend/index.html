<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GAMMA</title>
    <script>
      // Aplica el tema antes del primer pintado para evitar el destello de
      // modo claro cuando la preferencia guardada es oscura. Debe mantenerse
      // en sincronia con src/composables/useTheme.ts.
      (function () {
        try {
          var saved = localStorage.getItem('gamma_theme')
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
