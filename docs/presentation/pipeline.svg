  <text x="140" y="150" text-anchor="middle" font-size="16" fill="#7a8288">texto del gestor</text>
  <line x1="277" y1="140" x2="308" y2="140" stroke="#c4cace" stroke-width="2" marker-end="url(#mp)"/>
