<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 300" font-family="Inter, system-ui, -apple-system, sans-serif" role="img" aria-label="Pipeline del modelo ganador">
  <defs><marker id="mp" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto">
    <path d="M0,0 L10,4 L0,8 Z" fill="#c4cace"/></marker></defs>
  <rect x="15" y="74" width="250" height="132" rx="14" fill="#ffffff" stroke="#e6e6e3" stroke-width="1.5"/>
